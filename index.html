<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANEL FF V8</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        * {margin:0;padding:0;box-sizing:border-box; user-select:none;}
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #1a0033, #0f0024);
            color: #e0d4ff;
            min-height: 100vh;
            padding: 15px;
        }
        .container {max-width:520px; margin:0 auto;}

        .header {
            text-align:center; 
            margin-bottom:20px;
            padding:15px;
            background:rgba(30,10,60,0.9);
            border:2px solid #c026d3;
            border-radius:18px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size:2.1em; 
            background:linear-gradient(90deg,#c026d3,#a855f7,#e0b3ff); 
            -webkit-background-clip:text; 
            -webkit-text-fill-color:transparent; 
            margin-bottom:4px;
        }

        .subtitle {color:#d8b4fe; font-size:15px; font-weight:500;}

        .status-bar {
            display:flex; justify-content:space-between; background:rgba(30,10,60,0.8); 
            border:1px solid #c026d3; padding:12px 18px; border-radius:14px; margin:15px 0;
            font-size:14px;
        }

        .panel {background:rgba(20,8,45,0.95); border:2px solid #a855f7; border-radius:22px; padding:22px;}

        .section-title {
            color:#e0b3ff; margin:22px 0 12px; font-size:16px; font-weight:600;
            border-bottom:1px dashed #c026d3; padding-bottom:6px;
        }

        .grid {display:grid; grid-template-columns:1fr; gap:13px;}
        @media (min-width:380px) {.grid {grid-template-columns:1fr 1fr;}}

        .toggle {
            display:flex; justify-content:space-between; align-items:center;
            background:rgba(50,20,80,0.75); padding:15px 16px; border-radius:16px; 
            border:1px solid rgba(192,38,211,0.4); transition:0.4s;
        }
        .toggle:hover {background:rgba(70,30,110,0.85); border-color:#c026d3; transform:translateY(-3px);}

        /* สวิตช์ */
        .switch {
            position:relative; 
            width:62px; 
            height:32px; 
            flex-shrink:0;
        }
        .switch input {opacity:0; width:0; height:0;}

        .slider {
            position:absolute; 
            top:0; left:0; right:0; bottom:0; 
            background: linear-gradient(90deg, #3b2a5a, #4c3a6e);
            border-radius:50px; 
            transition: all 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
            border: 2px solid #6b4e9e;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
        }

        .slider:before {
            position:absolute; 
            content:""; 
            height:26px; 
            width:26px; 
            left:3px; 
            bottom:3px; 
            background: #e0d4ff;
            border-radius:50%; 
            transition: all 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
        }

        input:checked + .slider {
            background: linear-gradient(90deg, #c026d3, #a855f7, #e0b3ff);
            border-color: #e0b3ff;
            box-shadow: 0 0 22px rgba(192, 38, 211, 0.7);
        }
        input:checked + .slider:before {
            transform: translateX(30px);
            background: #ffffff;
            box-shadow: 0 0 12px rgba(255,255,255,0.9);
        }

        .inject-btn {
            width:100%; margin-top:30px; padding:18px; font-size:19px; font-weight:700;
            background:linear-gradient(135deg,#c026d3,#a855f7); color:white; border:none; 
            border-radius:16px; cursor:pointer; letter-spacing:1px;
            transition:0.3s;
        }
        .inject-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(192,38,211,0.8);
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: rgba(30,10,60,0.95);
            border: 2px solid #c026d3;
            border-radius: 20px;
            padding: 30px;
            max-width: 380px;
            text-align: center;
            color: #e0d4ff;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>PANEL FF V8</h1>
        <div class="subtitle">CR BY GODGOLF8888</div>
        <div class="subtitle">TIKTOK: godgolf888</div>
    </div>

    <div class="status-bar">
        <span>PING: <span id="ping">24</span>ms</span>
        <span>STATUS: <span style="color:#c026d3">ACTIVE</span></span>
    </div>

    <div class="panel">
        <div class="section-title">🎯 ระบบเล็งและล็อค</div>
        <div class="grid" id="aim"></div>

        <div class="section-title">👁️ มองทะลุ ESP</div>
        <div class="grid" id="vis"></div>

        <div class="section-title">⚔️ ปรับแต่งอาวุธ</div>
        <div class="grid" id="weap"></div>

        <div class="section-title">⚡ ประสิทธิภาพพิเศษ</div>
        <div class="grid" id="spec"></div>

        <button class="inject-btn" onclick="injectNow()">🔥 INJECT เข้าเกม FREE FIRE 🔥</button>
    </div>
</div>

<!-- Success Modal -->
<div class="modal" id="successModal">
    <div class="modal-content">
        <h2>🛡️ Injection สำเร็จ</h2>
        <p id="modalMessage" style="margin:20px 0; font-size:16px;"></p>
        <button onclick="closeModal()" style="padding:12px 30px; background:#c026d3; color:white; border:none; border-radius:12px; font-size:16px; cursor:pointer;">
            ปิด
        </button>
    </div>
</div>

<script>
const features = [
    {id:"f1",name:"🔫 ดูดหัว95%+",cat:"aim"},
    {id:"f2",name:"🎯 ล็อคเป้าอัตโนมัติ",cat:"aim"},
    {id:"f3",name:"👁️ FOV",cat:"aim"},
    {id:"f4",name:"💀 ยิงหัวอัตโนมัติ",cat:"aim"},
    {id:"f5",name:"🔫 ยิงทะลุ",cat:"aim"},
    
    {id:"f6",name:"📦 ESP แสดงกรอบตัว",cat:"vis"},
    {id:"f7",name:"📏 ESP แสดงระยะทาง",cat:"vis"},
    {id:"f8",name:"❤️ ESP แสดงแถบเลือด",cat:"vis"},
    {id:"f9",name:"🏷️ ESP แสดงชื่อ",cat:"vis"},
    {id:"f10",name:"📍 ESP มองทะลุไอช์อ",cat:"vis"},
    
    {id:"f11",name:"🚫 ไม่มีแรงดีด",cat:"weap"},
    {id:"f12",name:"⚡ รีโหลดเร็ว",cat:"weap"},
    {id:"f13",name:"🔥 ขยายดาเมจ",cat:"weap"},
    {id:"f14",name:"🔫 ยิงอัตโนมัติ",cat:"weap"},
    
    {id:"f15",name:"🚀 บูสต์ 120 FPS",cat:"spec"},
    {id:"f16",name:"🕹️ ตอบสนองเร็ว 0.1ms",cat:"spec"},
    {id:"f17",name:"📡 ลดปิงเน็ต",cat:"spec"},
    {id:"f18",name:"🛡️ กันแบน",cat:"spec"},
    {id:"f19",name:"🏃 วิ่งเร็ว +10%",cat:"spec"},
    {id:"f20",name:"🌊 เดินบนน้ำ",cat:"spec"}
];

function render() {
    features.forEach(f => {
        const d = document.createElement("div");
        d.className = "toggle";
        d.innerHTML = `
            <span>${f.name}</span>
            <label class="switch">
                <input type="checkbox" id="${f.id}">
                <span class="slider"></span>
            </label>`;
        document.getElementById(f.cat).appendChild(d);
    });
}

function getStates() {
    let s = {};
    features.forEach(f => {
        let cb = document.getElementById(f.id);
        s[f.id] = cb ? cb.checked : false;
    });
    return s;
}

window.injectNow = function() {
    let states = getStates();
    let count = Object.values(states).filter(Boolean).length;
    
    const message = `✅ เปิดใช้งาน ${count}/20 ฟังก์ชันเรียบร้อย\n\nพร้อมเล่น Free Fire แล้ว 🔥`;
    
    document.getElementById("modalMessage").innerText = message;
    document.getElementById("successModal").style.display = "flex";
};

function closeModal() {
    document.getElementById("successModal").style.display = "none";
}

// Ping Random
setInterval(() => {
    document.getElementById("ping").textContent = Math.floor(Math.random()*18 + 20);
}, 2000);

render();
</script>
</body>
</html>
